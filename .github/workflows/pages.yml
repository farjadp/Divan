# Publishes site/ to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site uses the same images as the README; copy them in so there is one source.
      - run: rm -rf site/assets && cp -r assets site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
