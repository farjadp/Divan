name: Bug
description: Something in the kit or the installer does not work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, shell version (bash --version), Claude Code version.
